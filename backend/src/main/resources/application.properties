spring.application.name=tradelab

spring.datasource.url=jdbc:postgresql://localhost:5433/tradelab
spring.datasource.username=tradelab
spring.datasource.password=tradelab

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=100
spring.jpa.properties.hibernate.order_inserts=true

spring.mvc.problemdetails.enabled=true

binance.api.url=https://api.binance.com
